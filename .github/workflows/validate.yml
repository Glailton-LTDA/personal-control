name: Validate application

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Lint, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54421
      VITE_SUPABASE_ANON_KEY: ci-public-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install verified Gitleaks
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_checksums.txt
          awk '$2 == "gitleaks_8.24.3_linux_x64.tar.gz"' gitleaks_8.24.3_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.24.3_linux_x64.tar.gz gitleaks
      - name: Scan source snapshot
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/source-snapshot"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/source-snapshot"
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/source-snapshot" --config .gitleaks.toml --redact --no-banner


      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage -- --maxWorkers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 14
      - name: Check coverage of changed production code
        if: ${{ !cancelled() }}
        env:
          COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-changed-coverage.mjs
      - run: npm run build

  browser:
    name: Application and global push browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54421
      VITE_SUPABASE_ANON_KEY: ci-public-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --workers=2
      - run: npm run test:e2e:push
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7

  functions:
    name: Reminder function tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - run: >-
          deno test --allow-env --no-config --node-modules-dir=none --no-lock
          supabase/functions/_shared/push.test.ts
          supabase/functions/health-reminders/index.test.ts
          supabase/functions/mf-reminders/index.test.ts

  database:
    name: Medical ownership, push migration and query plans
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: medical_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: disposable-ci-password
      PGDATABASE: medical_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Financial payments with two concurrent PostgreSQL sessions
        run: |
          createdb mf_finance_test
          python scripts/test-mf-concurrency.py --database mf_finance_test
      - name: Apply fixtures, migrations and security assertions
        shell: bash
        run: |
          for sql in \
            supabase/tests/health_bootstrap.sql \
            supabase/migrations/20261015000000_mf_push_subscriptions.sql \
            supabase/migrations/20261107112044_health_guide.sql \
            supabase/tests/global_push_legacy_seed.sql \
            supabase/migrations/20261107121840_global_push_notifications.sql \
            supabase/migrations/20261107161433_health_scheduler_auth_resolution.sql \
            supabase/migrations/20261109000149_health_appointment_followups.sql \
            supabase/migrations/20261109021510_health_recent_lists_indexes.sql \
            supabase/tests/health_followups_security.sql \
            supabase/tests/health_security.sql \
            supabase/tests/global_push_security.sql \
            supabase/tests/health_query_plans.sql
          do
            psql -v ON_ERROR_STOP=1 -f "$sql"
          done
