name: Apply Supabase production migrations

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrations.yml'
  workflow_dispatch:

permissions:
  contents: read

# Nunca deixa dois deploys de schema concorrerem. Diferente de cancel-in-progress,
# uma migration que já começou deve sempre terminar antes da próxima.
concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  push:
    name: Push migrations to production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: xfcehxyhhmuscodilfha

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo '::error::Missing SUPABASE_ACCESS_TOKEN secret.'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo '::error::Missing SUPABASE_DB_PASSWORD secret.'; exit 1; }

      - name: Apply pending migrations
        run: supabase db push --project-ref "$SUPABASE_PROJECT_REF"

      - name: Confirm migration history
        run: supabase migration list --project-ref "$SUPABASE_PROJECT_REF"
